name: Lab 3 — Experiments

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Experiment scope
        type: choice
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            lab3/requirements.txt
            lab3/requirements-test.txt
      - run: python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r lab3/requirements.txt
      - run: python -m lab3.setup_model
      - name: Download DIV2K and run smoke experiment
        if: inputs.scope == 'smoke'
        run: python -m lab3.main --ids 0801 --degradations severe --device cpu --out lab3/results/github
      - name: Download DIV2K and run full experiment
        if: inputs.scope == 'full'
        run: python -m lab3.main --device cpu --out lab3/results/github
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-${{ inputs.scope }}-results
          path: lab3/results/github/
          if-no-files-found: warn
