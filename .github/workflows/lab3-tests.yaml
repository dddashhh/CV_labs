name: Lab 3 — SR-inpainting

on:
  push:
    paths:
      - 'lab3/**'
      - '.github/workflows/lab3-tests.yaml'
      - '.github/workflows/lab3-experiments.yaml'
  pull_request:
    paths:
      - 'lab3/**'
      - '.github/workflows/lab3-tests.yaml'
      - '.github/workflows/lab3-experiments.yaml'
  workflow_dispatch:
    inputs:
      real_model:
        description: Run additional pretrained integration test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: lab3/requirements-test.txt

      - run: python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu

      - run: python -m pip install -r lab3/requirements-test.txt

      - name: Download DIV2K and run tests
        run: python -m pytest lab3/tests -v -s --junitxml=lab3/results/ci/tests.xml

      - name: Add test report to Summary
        if: always()
        run: python -m lab3.ci_report tests lab3/results/ci/tests.xml --markdown lab3/results/ci/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lab3-tests-${{ github.run_attempt }}
          path: lab3/results/ci/
          if-no-files-found: warn
          retention-days: 30

  smoke:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/lab3-experiments.yaml
    with:
      scope: smoke
      real_model: ${{ github.event_name == 'workflow_dispatch' && inputs.real_model == true }}