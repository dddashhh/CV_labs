name: Lab 3 — SR-inpainting

on:
  push:
    paths:
      - 'lab3/**'
      - '.github/workflows/lab3-tests.yaml'
  pull_request:
    paths:
      - 'lab3/**'
      - '.github/workflows/lab3-tests.yaml'
  workflow_dispatch:
    inputs:
      real_model:
        description: 'Run pretrained ResShift and perceptual metrics on CPU'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: lab3/requirements-test.txt
      - run: python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r lab3/requirements-test.txt
      - name: Download DIV2K and run tests
        run: python -m pytest lab3/tests -q -s
  pretrained:
    if: github.event_name == 'workflow_dispatch' && inputs.real_model
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r lab3/requirements.txt
      - run: python -m lab3.setup_model
      - name: Download DIV2K and test ResShift
        run: python -m pytest lab3/tests/test_pretrained.py -q -s
        env:
          LAB3_REAL_MODEL: '1'
          OMP_NUM_THREADS: '2'
