name: Lab 1 — Benchmark

on:
  push:
    paths:
      - 'lab1/**'
      - '.github/workflows/benchmark.yaml'
  pull_request:
    paths:
      - 'lab1/**'
      - '.github/workflows/benchmark.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab1/python/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r python/requirements.txt

      - name: Process test image
        run: python python/main.py images/test.png --thresh 127

      - name: Run correctness tests and benchmarks
        run: python python/benchmark.py

      - name: Generate plots
        if: always()
        run: python python/plot.py

      - name: Add benchmark report to Actions summary
        if: always()
        env:
          PAGES_BASE_URL: https://dariakaraseva.github.io/CV_labs
        run: python python/report.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab1-benchmark-${{ github.sha }}
          path: |
            lab1/results/*.csv
            lab1/results/*.json
            lab1/results/*.png
            lab1/results/images/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish results to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: lab1/results
          publish_branch: gh-pages
          destination_dir: lab1
          keep_files: true