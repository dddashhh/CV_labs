name: Lab 2 — Object tracking

on:
  push:
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2-tracking.yaml'
  pull_request:
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2-tracking.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracking:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64
          python -m pip install -r lab2/requirements.txt
      - name: Test tracking
        run: python -m pytest lab2/tests -v --junitxml=lab2/results/tests.xml
      - name: Run experiments on videos
        run: python -m lab2.experiment
      - name: Build job summary
        if: always()
        run: |
          mkdir -p lab2/results
          python -m lab2.test_report lab2/results/tests.xml | tee lab2/results/test-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f lab2/results/report.md ]; then
            sed '/^## Графики/,$d' lab2/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload tracked videos and reports
        if: always()
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: lab2-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab2/results/
          if-no-files-found: warn
          retention-days: 30
      - name: Link results
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf '\n[Видео, кадры, графики и report.md](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: tracking
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: lab2-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: lab2-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab2/results
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare public report
        env:
          PUBLISH_PANELS: ${{ vars.LAB2_PUBLISH_PANELS }}
        run: |
          python -m pip install -r lab2/requirements.txt
          mkdir -p "$RUNNER_TEMP/lab2-public"
          cp lab2/results/{coverage,fps}.png "$RUNNER_TEMP/lab2-public/"
          cp lab2/results/metrics.csv "$RUNNER_TEMP/lab2-public/"
          if [ "$PUBLISH_PANELS" = 'true' ]; then
            for file in lab2/results/*/hybrid/panel.jpg; do
              relative="${file#lab2/results/}"
              mkdir -p "$RUNNER_TEMP/lab2-public/$(dirname "$relative")"
              cp "$file" "$RUNNER_TEMP/lab2-public/$relative"
            done
            python -m lab2.report --out lab2/results --image-base . > "$RUNNER_TEMP/lab2-public/report.md"
          else
            python -m lab2.report --out lab2/results --image-base . --no-panels > "$RUNNER_TEMP/lab2-public/report.md"
          fi
      - name: Publish Lab 2 report and graphs
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/lab2-public
          publish_branch: gh-pages
          destination_dir: lab2/${{ github.run_id }}-${{ github.run_attempt }}
          keep_files: true
      - name: Show figures in Summary
        run: |
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/lab2/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '## ЛР2 — визуализация\n\n[Markdown-отчёт](%s/report.md)\n\n' "$base" >> "$GITHUB_STEP_SUMMARY"
          for file in coverage.png fps.png; do
            printf '![%s](%s/%s)\n\n' "$file" "$base" "$file" >> "$GITHUB_STEP_SUMMARY"
          done
          for file in "$RUNNER_TEMP/lab2-public"/*/hybrid/panel.jpg; do
            [ -f "$file" ] || continue
            relative="${file#$RUNNER_TEMP/lab2-public/}"
            printf '![%s](%s/%s)\n\n' "$relative" "$base" "$relative" >> "$GITHUB_STEP_SUMMARY"
          done
